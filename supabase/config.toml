[functions.verify-google-play-purchase]
verify_jwt = true

# The one function in this project that does not sit behind Supabase's JWT
# gate, because its caller is Google rather than a signed-in user: a Pub/Sub
# push carries a Google-minted OIDC token, which that gate would reject. The
# authentication it replaces is not skipped — `pubsub_auth.ts` verifies the
# token's signature against Google's published keys and pins both the audience
# and the pushing service account before the body is read.
[functions.google-play-rtdn]
verify_jwt = false

# WA-2. The gateway rejects requests without a valid Supabase JWT before the
# function runs; the function then decides admin privilege itself from the
# caller's session (`_shared/admin_auth.ts`). Both checks are required.
[functions.admin-session]
verify_jwt = true

# WA-7. The first privileged admin mutation. The gateway JWT check runs
# first; the function then verifies admin privilege (`requireAdmin`) and the
# database writer verifies it again from the same session.
[functions.admin-grant-salon-pilot]
verify_jwt = true

# WA-8. Allowance adjustment; same double gate as the grant.
[functions.admin-adjust-salon-pilot-allowance]
verify_jwt = true
